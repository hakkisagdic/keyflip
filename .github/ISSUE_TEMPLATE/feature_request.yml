name: "Feature Request / Ozellik Istegi"
description: "Suggest a new feature or improvement (Yeni bir ozellik veya iyilestirme onerin)"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request / Ozellik Istegi

        Thank you for suggesting an improvement! Please describe your idea below.
        Bir iyilestirme onerdiginiz icin tesekkurler! Lutfen fikrinizi asagida aciklayin.

  - type: textarea
    id: problem
    attributes:
      label: "Problem / Motivation (Sorun / Motivasyon)"
      description: "What problem does this solve? Why is this needed? (Bu hangi sorunu cozuyor? Neden gerekli?)"
      placeholder: "I'm frustrated when... / Su durumda sorun yasiyorum..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution / Onerilen Cozum"
      description: "Describe the solution you'd like (Istediginiz cozumu aciklayin)"
      placeholder: "I'd like keyflip to... / keyflip'in su sekilde calismasini istiyorum..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered / Dusunulen Alternatifler"
      description: "Any alternative solutions or features you've considered (Dusundugunuz alternatif cozumler)"
      placeholder: "I've also considered... / Ayrica su alternatifleri dusundum..."
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: "Additional Context / Ek Bilgi"
      description: "Any other context, screenshots, or examples (Diger baglam, ekran goruntuleri veya ornekler)"
      placeholder: "Additional information... / Ek bilgi..."
    validations:
      required: false
