# The IntelliJ Platform already provides the Kotlin stdlib on the classpath; don't bundle it.
kotlin.stdlib.default.dependency=false

# Speeds up configuration / incremental builds.
org.gradle.caching=true
org.gradle.configuration-cache=false

# Pinned to an English JVM locale on purpose: gradle-intellij-plugin's structure parser uppercases
# "application" with the DEFAULT locale, so a Turkish (tr_TR) host produces "APPLİCATİON", fails to
# parse the IDE's bundled plugin descriptors and then cannot resolve the terminal plugin.
org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC -Duser.language=en -Duser.country=US
